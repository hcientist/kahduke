{% load static %}{% with title=og_title|default:"KahDuke" description=og_description|default:"Live classroom kwizzes: put one on the projector and answer from your phone. No account needed."|striptags|truncatechars:200 %}
  <meta name="description" content="{{ description }}">
  <meta property="og:site_name" content="KahDuke">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ request.build_absolute_uri }}">
  <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'img/og-card.png' %}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="KahDuke, with the four answer shapes on JMU purple">
  <meta name="twitter:card" content="summary_large_image">
{% endwith %}
