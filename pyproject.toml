[project]
name = "kahduke"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.3",
    "django>=6.1.2",
    "django-allauth>=65.19.7",
    "django-environ>=0.14.0",
    "django-ninja>=1.7.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pylint-django>=2.8.0",
    "ruff>=0.17.1",
]
prod = [
    "psycopg[binary]>=3.3.6",
]

[tool.ruff]
extend-exclude = ["*/migrations"]

[tool.ruff.lint]
# Django's Meta options and pydantic field defaults are class attributes by design.
ignore = ["RUF012"]
